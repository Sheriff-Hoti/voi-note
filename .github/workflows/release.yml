# Release APK (ticket #8, docs/adr/0005): an arm64-v8a release APK signed with the voi-note release key.
# - A v* tag (vX.Y.Z): attached as voi-note.apk to a normal GitHub Release (never a pre-release), so
#   https://github.com/Sheriff-Hoti/voi-note/releases/latest/download/voi-note.apk serves the newest one.
# - A push to main or a manual run: uploaded as an Actions artifact, kept 14 days.
# Pull requests run only ci.yml (npm run check).
name: Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build job, which holds the signing secrets, cannot write to the repo. Only the
# tag-only release job below gets contents: write, and it never sees the secrets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the release certificate (public: every signed APK carries it). The build fails if the APK is
  # signed with anything else, such as the Expo debug key.
  RELEASE_CERT_SHA256: 6586be9cacaf106f876e8a97835fc160d7ae007f9ed5fed82a7d32587d594f2b

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The postinstall native swap (ADR 0002) downloads the sherpa-onnx and ORT AARs into .sherpa-cache/.
      - uses: actions/cache@v6
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('scripts/use-sherpa-2.0.3.sh') }}
      - run: npm ci

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release-version.js "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Not a release tag: keeping app.json's version"
          fi

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voi-note-release.p12"

      - name: Build release APK (arm64-v8a)
        working-directory: android
        env:
          VOI_NOTE_KEYSTORE: ${{ runner.temp }}/voi-note-release.p12
          VOI_NOTE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VOI_NOTE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VOI_NOTE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          args=(-PreactNativeArchitectures=arm64-v8a)
          [ -n "$VERSION_NAME" ] && args+=(-PvoiNoteVersionName="$VERSION_NAME" -PvoiNoteVersionCode="$VERSION_CODE")
          ./gradlew assembleRelease "${args[@]}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/voi-note.apk"

      - name: Check the APK
        run: |
          bash scripts/check-ort-symbol.sh voi-note.apk
          abis=$(unzip -Z1 voi-note.apk 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ABIs: $abis"
          [ "$abis" = "arm64-v8a " ] || { echo "APK must be arm64-v8a only, has: $abis" >&2; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs voi-note.apk | tee certs.txt
          grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt \
            || { echo "APK is not signed with the release key" >&2; exit 1; }
          "$tools/aapt2" dump badging voi-note.apk > badging.txt
          head -1 badging.txt
          ls -l voi-note.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voi-note-apk
          path: voi-note.apk
          retention-days: 14

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voi-note-apk
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" voi-note.apk -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag
