name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The postinstall native swap (ADR 0002) downloads the sherpa-onnx and ORT AARs into .sherpa-cache/.
      - uses: actions/cache@v6
        with:
          path: .sherpa-cache
          key: sherpa-${{ hashFiles('scripts/use-sherpa-2.0.3.sh') }}
      - run: npm ci
      - run: npm run check
